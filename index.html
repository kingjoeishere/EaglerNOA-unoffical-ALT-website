<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Lexend','Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#0a0a0a;color:#f9f9f9;line-height:1.6}
a{color:#ff5a5a;text-decoration:none}a:hover{text-decoration:underline}
.header{background:#000;border-bottom:1px solid #2a2a2a;padding:12px 24px;display:flex;align-items:center;position:sticky;top:0;z-index:100}
.header h1{font-size:20px;font-weight:700;color:#fff;font-family:'Lexend','Segoe UI',Roboto,Arial,sans-serif}
.menu-btn{display:none;background:none;border:none;font-size:24px;cursor:pointer;margin-right:16px;color:#ccc}
.offline-badge{background:#ea4335;color:#fff;font-size:11px;padding:2px 8px;border-radius:10px;margin-left:12px;font-weight:500}
.sidebar{width:260px;background:#141414;border-right:1px solid #2a2a2a;height:calc(100vh - 49px);position:fixed;top:49px;left:0;overflow-y:auto;z-index:90;transition:transform .3s}
.sidebar a{display:block;padding:10px 24px;color:#ccc;font-size:14px;border-left:3px solid transparent}.sidebar a:hover{background:#1c1c1c;color:#ff0000}.sidebar a.active{background:#1c1c1c;color:#ff0000;border-left-color:#ff0000;font-weight:500}
.main{margin-left:260px;margin-top:49px;padding:32px 48px;max-width:1000px;min-height:calc(100vh - 49px)}
.footer{margin-left:260px;background:#141414;border-top:1px solid #2a2a2a;padding:20px 48px;font-size:13px;color:#999;line-height:1.8}
h2{font-size:28px;font-weight:700;margin-bottom:16px;color:#fff;font-family:'Lexend','Segoe UI',Roboto,Arial,sans-serif}
h3{font-size:20px;font-weight:700;margin:20px 0 10px;color:#fff;font-family:'Lexend','Segoe UI',Roboto,Arial,sans-serif}
h4{font-size:16px;font-weight:500;margin:14px 0 8px;color:#fff}
p{margin-bottom:12px;font-size:15px;color:#e0e0e0}
.btn{display:inline-block;padding:8px 24px;border:1px solid #ff0000;border-radius:4px;background:#ff0000;color:#f9f9f9;font-size:14px;margin:4px;cursor:pointer;text-decoration:none;transition:all .2s}.btn:hover{background:#cc0000;border-color:#cc0000;text-decoration:none}
.btn-play{background:#ff0000;color:#f9f9f9;border-color:#ff0000}.btn-play:hover{background:#cc0000;text-decoration:none}
.card{background:#141414;border:1px solid #2a2a2a;border-radius:8px;padding:16px 20px;margin-bottom:12px}
.divider{border-top:1px solid #2a2a2a;margin:24px 0}
.version-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin:12px 0}
.article{background:#141414;border:1px solid #2a2a2a;border-radius:8px;padding:20px;margin-bottom:16px}
.article-date{font-size:12px;color:#888;margin-bottom:4px}
.article-title{font-size:18px;font-weight:700;margin-bottom:8px;color:#fff;font-family:'Lexend','Segoe UI',Roboto,Arial,sans-serif}
.article-body{font-size:14px;color:#e0e0e0;line-height:1.7}
.article-author{font-size:12px;color:#ff5a5a;margin-bottom:6px;font-weight:500}
.faq-item{margin-bottom:16px}.faq-q{font-weight:600;color:#fff}.faq-a{color:#e0e0e0;margin-top:4px}
.section-label{font-size:13px;font-weight:600;color:#ff5a5a;text-transform:uppercase;letter-spacing:.5px;margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid #2a2a2a}
ul{margin:8px 0 12px 24px}li{margin-bottom:4px;font-size:14px;color:#e0e0e0}
strong{color:#fff}
@media(max-width:768px){
.menu-btn{display:block}
.sidebar{transform:translateX(-100%)}
.sidebar.open{transform:translateX(0)}
.main,.footer{margin-left:0}
.main{padding:20px 16px}
.footer{padding:16px}
.version-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:480px){.version-grid{grid-template-columns:1fr}.btn{display:block;text-align:center}}
</style>

<div class="header">
<button class="menu-btn" onclick="toggleSidebar()">&#9776;</button>
<h1>Eaglercraft NOA V2</h1>
<span class="offline-badge" id="offlineBadge" style="display:none">OFFLINE</span>
</div>

<div class="footer" id="footer"></div>

window.ga=function(){};const DL='https://drive.google.com/uc?export=download&id=',GHV='https://eaglercraftnoa.github.io/version/',GHC='https://eaglercraftnoa.github.io/client/',GHCS='https://eaglercraftnoa.github.io/clients/';
const IS_ONLINE=navigator.onLine;
window.addEventListener('online',()=>{document.getElementById('offlineBadge').style.display='none'});
window.addEventListener('offline',()=>{document.getElementById('offlineBadge').style.display=''});
if(!navigator.onLine){document.getElementById('offlineBadge').style.display=''}

const NAV=['Hub','Launcher','Downloads','Clients Launcher','Client Downloads','Wispcraft','Pre-Releases','Source Codes','Servers','News','Mods','Texture Packs','Custom Skins','Custom Capes','Memes','YouTubers','Skidders','Eagler History','FAQ','Tutorials','Feedback','NOA Projects','Backups'];

const FOOTER='Made by TheCookering, MC Files, and Th3Lord of Jkcuk\'s, Randomahhdev, and Bramcracker! We are also not affiliated with Mojang AB or Microsoft. And by using this site you agree to the use of Google Analytics. Currently on U4';

function navHash(name){return name.toLowerCase().replace(/\s+/g,'-')}

function renderSidebar(){
let h='';
NAV.forEach(n=>{
const a=navHash(n);
h+=`<a href="#${a}" data-nav="${a}">${n}</a>`;
});
document.getElementById('sidebar').innerHTML=h;
}

function renderFooter(){document.getElementById('footer').innerHTML=FOOTER}

function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open')}

function closeSidebar(){document.getElementById('sidebar').classList.remove('open')}

function fmtDrive(url){return`<a href="${url}" target="_blank" rel="noopener" class="btn btn-play">Download</a>`}
function fmtPlay(url){return`<a href="${url}" target="_blank" rel="noopener" class="btn btn-play">Play</a>`}
function fmtGitHub(url){return`<a href="${url}" target="_blank" rel="noopener" class="btn">GitHub</a>`}
function fmtExternal(url,label){return`<a href="${url}" target="_blank" rel="noopener" class="btn">${label||'Open'}</a>`}

function grid(arr){return`<div class="version-grid">${arr.join('')}</div>`}

pages['news']=()=>`
<h2>News</h2>
<p>Were you can find the newest and latest Eaglercraft news. You may also search up news articles that are on this page. If there isn't anything new or intresting it will not be here even on Sundays and Thursdays.</p>
<div class="divider"></div>

<div class="article">
<div class="article-date">8/30/26</div>
<div class="article-title">Welcome back, Precision Client.</div>
<div class="article-author">MC Files</div>
<div class="article-body">I am excited to announce that Precision Client v1.0.0 has finally been released! After the project's disappearance for what seemed to be CyanogenMC (Client) and Precision Client 2, people began to stop waiting as all of those were cancelled, along with, well, Precision. During that time, people stayed in the server just waiting, as they hoped one day, it would finally release. Well, now it has! You can use it at EaglerNOA however, here is the discord for Precision Client so you can find more information. <a href="https://discord.gg/bvZ3UE5cGc" target="_blank" rel="noopener">https://discord.gg/bvZ3UE5cGc</a></div>
</div>

<div class="article">
<div class="article-date">8/30/26</div>
<div class="article-title">Eaglercraft 26.2 already?!</div>
<div class="article-author">TheCookering</div>
<div class="article-body">Welp, we did it guys, a beta HTML file of Eaglercraft 26.2, or commonly known as Eaglercraft 26.2 0.4 has just been released. The reason everyone is losing their minds is that this is the newest version of Minecraft, and it was ported in 3 months. Most Eaglercraft ports usually take nearly a year! The porter, o_xer, he is not as discussed as porters such as Syntaxsavy, or EymenWSMC, but he made the buggest impact! He is the saving grace after the summer DMCA's Eaglercraft experienced, and controversy, as it continues to update, it heals the damage made at the same time.</div>
</div>

<div class="article">
<div class="article-date">8/22/26</div>
<div class="article-title">Eaglercraft 1.20.6 has been released</div>
<div class="article-author">MC Files</div>
<div class="article-body">Eaglercraft 1.20.6 has been released alongside 1.14.4 u1 by eymenwsmc. What to expect: Lag, as this is a beta release. It is proper 1.20.6, for the first time ever, as it isn't a backport unlike previous clients, such as EaglyMC or EaglercraftZ. As more versions are being ported, more variety has been achieved in the eaglercraft community, which will hopefully continue for the meanwhile.</div>
</div>

<div class="article">
<div class="article-date">8/9/26</div>
<div class="article-title">We will miss you Ampler</div>
<div class="article-author">TheCookering</div>
<div class="article-body">Yesterday, another DMCA takedown was sent, however it wasn't sent to any GitHub Repo, it was sent to Ampler Launcher, a famous launcher in the Eaglercraft community. Ampler launcher stood out over others, it was a part of the Eagler community for 3 years! Now, other Eaglercraft launchers on GitHub, are worried they might be next.</div>
</div>

<div class="article">
<div class="article-date">7/31/26</div>
<div class="article-title">Major DMCA's That Could Delay Major Ports & Drama Going Around Of A Major Client Developer?</div>
<div class="article-author">Reported by TheCookering</div>
<div class="article-body">Today was one of the worst days the Eaglercraft community has seen. Around 9 AM Eastern, Eaglercraft.dev, a very known Eaglercraft launcher would get DMCA'd for hosting EaglyMC on their website, and for owning the core domain. This deleyed the amount of updates the launcher will get. Two hours after, Eaglers all around the globe were hit again, with even more devestating news. Novix 26.1.2 was DMCA'd aswell, and is now discontinued. That wasn't the end of the DMCA's, EymenWSMC, currently porting Eaglercraft 1.14.4 was also DMCA'd for a second time. And prior to all of this, BarneyTheGod, known for creating famous client Astra Client, was exposed for making fun of someone's mental health, and uses of the Nazi symbol.</div>
</div>

<div class="article">
<div class="article-date">7/23/26</div>
<div class="article-title">Woah, is that 1.14.4?</div>
<div class="article-author">Reported by MC Files</div>
<div class="article-body">Yes! Eaglercraft 1.14.4 was released yesterday with great, maybe even the best possible performance for any version of Eaglercraft. It's meant to be the Village and Pillage update, an update that overhauled villages. It's the perfect version for villager things, but I do not personally know much about it. Despite Eaglercraft 1.14.4, EymenWSMC is aware, and is fixing them as of right now.</div>
</div>

<div class="article">
<div class="article-date">7/11/26</div>
<div class="article-title">Beta 1.16.5 has been released!</div>
<div class="article-author">MC Files</div>
<div class="article-body">That's right. The first beta version for 1.16.5 Eaglercraft has officially been released in their discord server. Performance at the moment is quite bad (in the first release), along with it actually generating the world. Personally, on my device I was able to load inside the world with my ordinary performance, however, it does not work the greatest on other devices. Acorndev claims that he has fixed the issue, but time is to tell. Features are ordinary for 1.16.5 at the given moment, with Aero Client Reborn confirmed to be in the version 1.16.5.</div>
</div>

<div class="article">
<div class="article-date">6/23/26</div>
<div class="article-title">1.18.2 is just knocking at the door</div>
<div class="article-author">TheCookering</div>
<div class="article-body">This month has been one of the most eventful times in Eaglercraft history! Syantaxsavy released the first beta build of Eaglercraft 1.21.11, and along with that a developer by the name of AcornDev announced he's making Eaglercraft 1.16, after the events TheBannanaManJCG scammed us again with Eaglercraft 26.1.1. Then out of left field, q13x released Eaglercraft 26.1.2, sure it was limited but it some sound waves across the community. Then a new dev, Novix finished q13x's project, using modern blaze3d backend spi on webgpu. But now 1.18.2 makes a scene! Already blocks have been implemented, and reports have shown that amathist geodes now generate.</div>
</div>

<div class="article">
<div class="article-date">6/14/26</div>
<div class="article-title">Novix Project - Minecraft 26.1.2 in the Browser</div>
<div class="article-author">MC Files</div>
<div class="article-body">5 years ago, Eaglercraft was in version 1.5.2, that took around 4 months of code. In todays era of Eaglercraft, dev Novix, just made even more history than Syntaxsavy. Minecraft version 26.1.2, was released just two months ago, and now he will fully port it. In an interview I did with him he said he did this becuase he had free time, and Eaglercraft was outdated. Currently he fully ported singleplayer and continues to do more.</div>
</div>

<div class="article">
<div class="article-date">6/2/26</div>
<div class="article-title">Eaglercraft 1.16!</div>
<div class="article-author">MC Files</div>
<div class="article-body">My favorite version finally comes to the Eaglercraft community! This was a well recieved updated from Minecraft.</div>
</div>

<div class="article">
<div class="article-date">5/24/26</div>
<div class="article-title">Astra Client 2?</div>
<div class="article-author">MC Files</div>
<div class="article-body">BarneytheGod recently shared a clip of Astra Client 2. It has newer features not seen before.</div>
</div>

<div class="article">
<div class="article-date">5/23/26</div>
<div class="article-title">IDK, Eaglercraft 1.17</div>
<div class="article-author">MC Files</div>
<div class="article-body">A recent post in the EaglercraftZ discord showed a discord for Eaglercraft 1.17, so far it is still in development, but what it holds for the future is ground breaking.</div>
</div>

<div class="article">
<div class="article-date">5/10/26</div>
<div class="article-title">Eaglercraft's one and only Syntaxsavy</div>
<div class="article-author">MC Files</div>
<div class="article-body">A recent leak on Syntaxsavy discord server showcases a video of Syntaxsavy playing Eaglercraft 1.21, even though it has bugs, it is still to be noted in the Eaglercraft Hall of Fame if that is a thing.</div>
</div>

<div class="article">
<div class="article-date">5/9/26</div>
<div class="article-title">NexoMC is scam and malicious</div>
<div class="article-author">MC Files</div>
<div class="article-body">For the community of Eaglercraft, NexoMC is a plugin that hacks servers and crashes games. It is also reported a trojan or virus, and no one should use it.</div>
</div>

<div class="article">
<div class="article-date">5/6/26</div>
<div class="article-title">Making 1.14</div>
<div class="article-author">EymenWSMC</div>
<div class="article-body">Got bored and making Eaglercraft 1.14, I am almost done. Updating textures.</div>
</div>

<div class="article">
<div class="article-date">4/30/26</div>
<div class="article-title">The most annoying Eaglercraft redditor?</div>
<div class="article-author">MC Files</div>
<div class="article-body">Intelligent-Rule7342 is probably the most known, and most hated Eaglercraft person of all time in Eaglercraft's history. The community has not appreciated his 'join my server codes', and report him for spamming. It is no wonder why his karma is -29.</div>
</div>
`;

<h2>FAQ</h2>
<div class="divider"></div>
${[

["What is the difference between JAVS and WASM?","JAVS stands for JavaScript, it can be ran on any computer, WASM on the other hand, improves your game play, but not all hardware can run WASM."],
["What are clients?","Clients both boost your games FPS and adds extra features such as built in fullbright plus other stuff."],

function render(name){
const main=document.getElementById('main');
var p=pages[name];p=p&&p.call?p():p;main.innerHTML=p||`<h2>Page not found</h2><p>The page "${name}" does not exist.</p>`;
main.scrollTop=0;
window.scrollTo(0,0);
document.querySelectorAll('.sidebar a').forEach(a=>{a.classList.toggle('active',a.getAttribute('data-nav')===name)});
}

function navigate(){
const hash=location.hash.slice(1)||'hub';
render(hash);
closeSidebar();
}

window.addEventListener('hashchange',navigate);
window.addEventListener('load',()=>{
renderSidebar();
renderFooter();
navigate();
});
</script>
</body>
</html>
